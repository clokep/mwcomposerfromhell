[build-system]
requires = ["setuptools>=38.6.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mwcomposerfromhell"
version = "0.5"
description = "Convert the parsed MediaWiki wikicode (using mwparserfromhell) to HTML."
readme = "README.rst"
requires-python = ">=3.11"
dependencies = [
    "mwparserfromhell>=0.6.2",
]
authors = [
    {name = "Patrick Cloke", email = "clokep@patrick.cloke.us"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: ISC License (ISCL)",
]
[project.optional-dependencies]
dev = [
    # For running tests.
    "pytest>=9.0",
    "coverage",
    # Linting and formatting.
    "ruff>=0.17.6",
    # For Python 3.11+ compatibility.
    "importlib-metadata>=4.2.0",
    # Typing related.
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/clokep/mwcomposerfromhell"

[tool.setuptools.packages.find]
exclude = ["tests"]

[tool.mypy]
files = ["mwcomposerfromhell", "tests"]
ignore_missing_imports = true
show_error_codes = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "mwcomposerfromhell.*"
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_untyped_decorators = true


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "A",  # flake8-builtins
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B905",  # zip strict parameter (not needed for py311)
]

[tool.ruff.lint.isort]
known-first-party = ["mwcomposerfromhell"]
