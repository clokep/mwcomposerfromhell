[build-system]
requires = ["setuptools>=38.6.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mwcomposerfromhell"
version = "0.5"
description = "Convert the parsed MediaWiki wikicode (using mwparserfromhell) to HTML."
readme = "README.rst"
requires-python = ">=3.11"
dependencies = [
    "mwparserfromhell>=0.6.2",
]
authors = [
    {name = "Patrick Cloke", email = "clokep@patrick.cloke.us"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: ISC License (ISCL)",
]
[project.optional-dependencies]
dev = [
    # For running tests.
    "pytest>=8.0",
    "coverage",
    # Style checking.
    "flake8>=3.9",
    "flake8-builtins>=1.5",
    "flake8-import-order>=0.18",
    # For Python 3.11+ compatibility.
    "importlib-metadata>=4.2.0",
    # Typing related.
    "mypy>=1.0.0",
    # Formatting.
    "black>=23.0.0",
]

[project.urls]
Homepage = "https://github.com/clokep/mwcomposerfromhell"

[tool.setuptools.packages.find]
exclude = ["tests"]

[tool.mypy]
files = ["mwcomposerfromhell", "tests"]
ignore_missing_imports = true
show_error_codes = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "mwcomposerfromhell.*"
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_untyped_decorators = true
